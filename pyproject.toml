[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ttu-loeng"
version = "0.1.0"
description = "Echo360 loengu ajatemplitega transkriptsioon ja slaiditöötlus"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
lecture-notes = "lecture_notes.cli:main"
lecture-notes-asr = "lecture_notes.asr_benchmark:main"
lecture-slides = "lecture_notes.slides:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
