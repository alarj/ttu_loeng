[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ttu-loeng"
version = "0.1.0"
description = "Echo360 loengu ajatemplitega transkriptsioon ja slaiditöötlus"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
web = [
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "itsdangerous>=2.2,<3",
    "jinja2>=3.1,<4",
    "markdown-it-py>=3,<5",
    "oracledb>=2.5,<4",
    "python-multipart>=0.0.20,<1",
    "uvicorn>=0.34,<1",
]
worker = [
    "oracledb>=2.5,<4",
]

[project.scripts]
lecture-notes = "lecture_notes.cli:main"
lecture-notes-asr = "lecture_notes.asr_benchmark:main"
lecture-slides = "lecture_notes.slides:main"
ttu-loeng-worker = "lecture_notes.web.worker:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"lecture_notes.web" = ["templates/*.html", "static/*.css", "static/*.js"]
